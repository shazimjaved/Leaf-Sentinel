# LeafSentinel — Dataset Audit & Validation Configuration

paths:
  raw_data_dir: "data/raw/plantseg"
  output_dir: "outputs/audit"
  reports_dir: "outputs/audit/reports"
  figures_dir: "outputs/audit/figures"
  samples_dir: "outputs/audit/samples"

validation:
  allowed_image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".webp"
    - ".tif"
    - ".tiff"
  allowed_mask_extensions:
    - ".png"
    - ".bmp"
    - ".tif"
    - ".tiff"
    - ".jpg"
    - ".jpeg"
  min_resolution: [32, 32]
  max_aspect_ratio: 5.0
  check_connected_components: true
  mask_ratio_tolerance: 0.05

duplicates:
  exact_hash: "md5"
  enable_perceptual_hash: true
  dhash_size: 16
  hamming_distance_threshold: 6
  check_cross_split_leakage: true

feasibility:
  strong_candidate_min_samples: 100
  strong_candidate_min_masks: 80
  usable_min_samples: 40
  usable_min_masks: 30
  limited_min_samples: 15
  limited_min_masks: 10

visualization:
  dpi: 300
  sample_count: 24
  colormap: "tab20"
  mask_overlay_alpha: 0.45
  mask_overlay_color: [230, 40, 40]
