# configs/severity.yaml
experiment_name: "Phase4_Severity_Regression_Local"

dataset:
  severity_manifest: "outputs/severity/dataset/severity_manifest.csv"
  root: "data/raw/plantseg"
  image_size: 224

training:
  batch_size: 4
  num_workers: 0
  epochs: 30
  early_stopping_patience: 7
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: false
  seed: 42

loss:
  name: "l1"

paths:
  training_dir: "outputs/severity/training/local_run"
